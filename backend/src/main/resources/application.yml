server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 16KB
spring:
  application:
    name: morula-care-demo
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  main:
    banner-mode: "off"
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
logging:
  level:
    root: INFO
    org.springframework.security: WARN
# Intentionally no default profile. Start explicitly with --spring.profiles.active=demo.
# Storage is independent of profile activation; unknown selections fail closed.
morula:
  demo-storage: ${MORULA_DEMO_STORAGE:memory}
