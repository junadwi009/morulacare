name: morula-care-local

services:
  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: demo
      MORULA_DEMO_STORAGE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-morula_demo}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-morula_demo}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Run node.exe scripts/setup-local.mjs first}
    ports:
      - "127.0.0.1:8080:8080"
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      db:
        condition: service_healthy
    networks: [default, database]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost:8080/actuator/health]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 24

  db:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morula_demo}
      POSTGRES_USER: ${POSTGRES_USER:-morula_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node.exe scripts/setup-local.mjs first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 20s

  verify:
    profiles: [tools]
    build:
      context: ./backend
      target: build
    working_dir: /app
    command: [mvn, -B, --no-transfer-progress, verify, -Ppostgres-it, '-DargLine=-Xmx256m']
    environment:
      MAVEN_OPTS: -Xmx256m
      MORULA_TEST_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-morula_demo}
      MORULA_TEST_DATABASE_USERNAME: ${POSTGRES_USER:-morula_demo}
      MORULA_TEST_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run node.exe scripts/setup-local.mjs first}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks: [default, database]
    mem_limit: 1g
    cpus: 1.0

networks:
  default:
    ipam:
      config:
        - subnet: ${MORULA_SUBNET:-10.253.249.0/28}
  database:
    internal: true
    ipam:
      config:
        - subnet: ${MORULA_DATABASE_SUBNET:-10.253.248.0/28}

volumes:
  postgres-data:
